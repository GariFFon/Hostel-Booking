name: backend-ci
on:
  push: { paths: ['backend/**', '.github/workflows/backend-ci.yml'] }
  pull_request: { paths: ['backend/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hostel, POSTGRES_PASSWORD: hostel_dev_pw, POSTGRES_DB: hostel_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hostel" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://hostel:hostel_dev_pw@127.0.0.1:5432/hostel_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/1
      APP_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DEMO_WEBHOOK_SECRET: ci-demo-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
